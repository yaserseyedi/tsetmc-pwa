<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اعلان‌های TSETMC</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { font-family: Tahoma, sans-serif; text-align: center; padding: 40px 20px; background: #f8f9fa; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
    button { background: #28a745; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; margin-top: 15px; }
  </style>

  <!-- PushAlert Unified Code -->
  <script type="text/javascript">
      (function(d, t) {
          var g = d.createElement(t),
          s = d.getElementsByTagName(t)[0];
          g.src = "https://cdn.pushalert.co/unified_0feace4d089b62f0948d07da3d5ad805.js";
          s.parentNode.insertBefore(g, s);
      }(document, "script"));
  </script>
  <!-- End PushAlert Unified Code -->
</head>
<body>
  <div class="card">
    <h2>  no</h2>
    <p>NO</p>
    <button onclick="requestNotification()">فعال‌سازی نوتیفیکیشن</button>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', { scope: './' });
    }

    function requestNotification() {
      if ('Notification' in window) {
        Notification.requestPermission().then(function(permission) {
          if (permission === 'granted') {
            alert('دسترسی نوتیفیکیشن با موفقیت تایید شد!');
          } else if (permission === 'denied') {
            alert('دسترسی نوتیفیکیشن مسدود شده است. لطفاً از تنظیمات مرورگر آن را باز کنید.');
          }
        });
      } else {
        alert('مرورگر شما از Notification پشتیبانی نمی‌کند.');
      }
    }
  </script>
</body>
</html>
